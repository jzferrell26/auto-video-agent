version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      remotion:
        patterns: ['remotion', '@remotion/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vitest:
        patterns: ['vitest', '@vitest/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal information, client media, transcripts, account IDs or private URLs. Use Security > Report a vulnerability for security issues.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact commands and the smallest synthetic input that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node/npm versions, FFmpeg version if relevant, and project commit.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all secrets, personal data, client content and account identifiers from this report.
          required: true
